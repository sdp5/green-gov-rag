name: AI-Powered PR Summary

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  models: read   # Required to call GitHub Models API

jobs:
  summarize_pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff format check
        id: ruff
        run: |
          set -e
          echo "Running Ruff formatter..."
          cd backend && make format
        continue-on-error: true  # Don’t fail workflow, just report

      - name: Report Ruff results
        if: steps.ruff.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "⚠ **Ruff detected formatting issues.** Please run `make format` locally and commit the changes."
            })

      - name: Get PR diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}:${{ github.event.pull_request.base.ref }}
          git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > pr.diff

      - name: Generate PR summary using GitHub Models
        id: ai_summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIFF_CONTENT=$(head -c 6000 pr.diff | jq -Rs .) # Limit input size for model safety
          PROMPT=$(jq -n --arg diff "$DIFF_CONTENT" '{
            model: "gpt-4o-mini",
            messages: [
              {"role": "system", "content": "You are a helpful assistant that summarizes code changes in a GitHub pull request."},
              {"role": "user", "content": "Summarize the PR diff briefly in a 2 or 3 bullet points highlighting key changes and potential impact:\n\n\($diff) between 80-120 words.\n\nGive one improvement suggestion if applicable."}
            ]
          }')

          RESPONSE=$(curl -s "https://models.github.ai/inference/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -d "$PROMPT")

          SUMMARY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
          echo "PR_SUMMARY<<EOF" >> $GITHUB_ENV
          echo "$SUMMARY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post AI-generated summary as PR comment
        uses: actions/github-script@v7
        env:
          PR_SUMMARY: ${{ env.PR_SUMMARY }}
        with:
          script: |
            const body = `### Summary\n\n${process.env.PR_SUMMARY}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

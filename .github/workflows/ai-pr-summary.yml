name: AI-Powered PR Summary

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  models: read   # Required to call GitHub Models API

jobs:
  summarize_pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}:${{ github.event.pull_request.base.ref }}
          git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > pr.diff

      - name: Generate PR summary using GitHub Models
        id: ai_summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIFF_CONTENT=$(head -c 6000 pr.diff | jq -Rs .) # Limit input size for model safety
          PROMPT=$(jq -n --arg diff "$DIFF_CONTENT" '{
            model: "gpt-4o-mini",
            messages: [
              {"role": "system", "content": "You are a helpful assistant that summarizes code changes in a GitHub pull request."},
              {"role": "user", "content": "Summarize the following PR diff in concise bullet points highlighting key changes, purpose, and potential impact:\n\n\($diff)"}
            ]
          }')

          RESPONSE=$(curl -s "https://models.github.ai/inference/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -d "$PROMPT")

          SUMMARY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
          echo "PR_SUMMARY<<EOF" >> $GITHUB_ENV
          echo "$SUMMARY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post AI-generated summary as PR comment
        uses: actions/github-script@v7
        env:
          PR_SUMMARY: ${{ env.PR_SUMMARY }}
        with:
          script: |
            const body = `## AI-Generated PR Summary\n\n${process.env.PR_SUMMARY}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

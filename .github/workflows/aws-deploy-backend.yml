name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/docker/backend.Dockerfile'
      - 'deploy/aws/**'
      - '.github/workflows/aws-deploy-backend.yml'
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: greengovrag-backend

jobs:
  deploy:
    if: false  # Change to true to enable deployment
    name: Deploy Backend to AWS ECS
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build Docker image
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -f deploy/docker/backend.Dockerfile \
            .

          # Push image to ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update ECS task definition with secrets
        run: |
          # Get current task definition
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster GreenGovRAG-Cluster \
            --services GreenGovRAG-BackendService \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].taskDefinition' \
            --output text)

          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition $TASK_DEF_ARN \
            --region ${{ env.AWS_REGION }})

          # Update environment variables with secrets
          NEW_TASK_DEF=$(echo $TASK_DEF | jq --arg api_key "${{ secrets.API_ACCESS_KEY }}" \
            --arg azure_key "${{ secrets.AZURE_OPENAI_API_KEY }}" \
            --arg azure_endpoint "${{ secrets.AZURE_OPENAI_ENDPOINT }}" \
            '.taskDefinition |
            .containerDefinitions[0].environment |= map(
              if .name == "API_ACCESS_KEY" then .value = $api_key
              elif .name == "AZURE_OPENAI_API_KEY" then .value = $azure_key
              elif .name == "AZURE_OPENAI_ENDPOINT" then .value = $azure_endpoint
              else . end
            ) |
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')

          # Register new task definition
          aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --region ${{ env.AWS_REGION }}

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster GreenGovRAG-Cluster \
            --service GreenGovRAG-BackendService \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster GreenGovRAG-Cluster \
            --services GreenGovRAG-BackendService \
            --region ${{ env.AWS_REGION }}

      - name: Get deployment status
        run: |
          aws ecs describe-services \
            --cluster GreenGovRAG-Cluster \
            --services GreenGovRAG-BackendService \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].deployments' \
            --output table

      - name: Run post-deployment health check
        run: |
          # Get API Gateway URL from CloudFormation outputs
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name GreenGovRAGStack \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiGatewayURL`].OutputValue' \
            --output text \
            --region ${{ env.AWS_REGION }})

          # Health check
          echo "Checking health at: ${API_URL}/api/health"
          curl -f "${API_URL}/api/health" || exit 1
          echo "✓ Deployment successful!"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed! Check logs above for details."
          # Add Slack/email notification here if needed

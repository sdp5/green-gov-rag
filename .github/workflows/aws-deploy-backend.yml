name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/docker/backend.Dockerfile'
      - 'deploy/docker/start.sh'
      - 'deploy/aws/**'
      - '.github/workflows/aws-deploy-backend.yml'
  workflow_dispatch:

jobs:
  # Ensure CI tests pass before deploying
  ci-backend:
    uses: ./.github/workflows/ci-backend.yml
    secrets: inherit

  deploy:
    if: true  # Change to true to enable deployment
    name: Deploy Backend to AWS ECS
    runs-on: ubuntu-latest
    environment: aws-prod
#    needs: ci-backend  # Wait for tests to pass
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get version from setuptools-scm
        id: version
        run: |
          pip install setuptools-scm
          VERSION=$(python -m setuptools_scm)
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Detected version: ${VERSION}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build Docker image for ARM64 (matches ECS Fargate ARM)
          docker buildx build \
            --platform linux/arm64 \
            --build-arg VERSION=${{ steps.version.outputs.VERSION }} \
            -t $ECR_REGISTRY/${{ vars.ECR_REPOSITORY }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ vars.ECR_REPOSITORY }}:latest \
            -f deploy/docker/backend.Dockerfile \
            --push \
            .

          echo "image=$ECR_REGISTRY/${{ vars.ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Install AWS CDK
        run: |
          npm install -g aws-cdk
          pip install -r deploy/aws/requirements.txt

      - name: Preview CDK changes
        env:
          APP_ENV: ${{ vars.APP_ENV }}
          API_ACCESS_KEY: ${{ secrets.API_ACCESS_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          CLOUD_PROVIDER: ${{ vars.CLOUD_PROVIDER }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          SQL_DB_PASSWORD: ${{ secrets.SQL_DB_PASSWORD }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
          VECTOR_STORE_TYPE: ${{ vars.VECTOR_STORE_TYPE }}
          ENABLE_CACHE: ${{ vars.ENABLE_CACHE }}
          ENABLE_REDIS_CACHE: ${{ vars.ENABLE_REDIS_CACHE }}
          CACHE_TTL: ${{ vars.CACHE_TTL }}
          ENABLE_SEMANTIC_CACHE: ${{ vars.ENABLE_SEMANTIC_CACHE }}
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
        run: |
          cd deploy/aws
          echo "=== Preview of changes that will be deployed ==="
          cdk diff \
            --context app_env="${APP_ENV}" \
            --context api_access_key="${API_ACCESS_KEY}" \
            --context azure_openai_api_key="${AZURE_OPENAI_API_KEY}" \
            --context azure_openai_endpoint="${AZURE_OPENAI_ENDPOINT}" \
            --context cloud_provider="${CLOUD_PROVIDER}" \
            --context bedrock_model_id="${BEDROCK_MODEL_ID}" \
            --context qdrant_api_key="${QDRANT_API_KEY}" \
            --context sql_db_password="${SQL_DB_PASSWORD}" \
            --context llm_provider="${LLM_PROVIDER}" \
            --context llm_model="${LLM_MODEL}" \
            --context azure_openai_deployment="${AZURE_OPENAI_DEPLOYMENT}" \
            --context azure_openai_api_version="${AZURE_OPENAI_API_VERSION}" \
            --context embedding_model="${EMBEDDING_MODEL}" \
            --context vector_store_type="${VECTOR_STORE_TYPE}" \
            --context enable_cache="${ENABLE_CACHE}" \
            --context enable_redis_cache="${ENABLE_REDIS_CACHE}" \
            --context cache_ttl="${CACHE_TTL}" \
            --context enable_semantic_cache="${ENABLE_SEMANTIC_CACHE}" \
            --context image_tag="${{ github.sha }}" 2>&1 | grep -v -E "(api_key|password|secret|endpoint|token)" || true

      - name: Deploy CDK Stack
        env:
          APP_ENV: ${{ vars.APP_ENV }}
          API_ACCESS_KEY: ${{ secrets.API_ACCESS_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          CLOUD_PROVIDER: ${{ vars.CLOUD_PROVIDER }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          SQL_DB_PASSWORD: ${{ secrets.SQL_DB_PASSWORD }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
          VECTOR_STORE_TYPE: ${{ vars.VECTOR_STORE_TYPE }}
          ENABLE_CACHE: ${{ vars.ENABLE_CACHE }}
          ENABLE_REDIS_CACHE: ${{ vars.ENABLE_REDIS_CACHE }}
          CACHE_TTL: ${{ vars.CACHE_TTL }}
          ENABLE_SEMANTIC_CACHE: ${{ vars.ENABLE_SEMANTIC_CACHE }}
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
        run: |
          cd deploy/aws

          # Deploy stack with secrets passed as context
          cdk deploy --require-approval never \
            --context app_env="${APP_ENV}" \
            --context api_access_key="${API_ACCESS_KEY}" \
            --context azure_openai_api_key="${AZURE_OPENAI_API_KEY}" \
            --context azure_openai_endpoint="${AZURE_OPENAI_ENDPOINT}" \
            --context cloud_provider="${CLOUD_PROVIDER}" \
            --context bedrock_model_id="${BEDROCK_MODEL_ID}" \
            --context qdrant_api_key="${QDRANT_API_KEY}" \
            --context sql_db_password="${SQL_DB_PASSWORD}" \
            --context llm_provider="${LLM_PROVIDER}" \
            --context llm_model="${LLM_MODEL}" \
            --context azure_openai_deployment="${AZURE_OPENAI_DEPLOYMENT}" \
            --context azure_openai_api_version="${AZURE_OPENAI_API_VERSION}" \
            --context embedding_model="${EMBEDDING_MODEL}" \
            --context vector_store_type="${VECTOR_STORE_TYPE}" \
            --context enable_cache="${ENABLE_CACHE}" \
            --context enable_redis_cache="${ENABLE_REDIS_CACHE}" \
            --context cache_ttl="${CACHE_TTL}" \
            --context enable_semantic_cache="${ENABLE_SEMANTIC_CACHE}" \
            --context image_tag="${{ github.sha }}"

      - name: Force new ECS deployment
        run: |
          # Get cluster and service names from CloudFormation stack outputs
          CLUSTER_NAME=$(aws cloudformation describe-stacks \
            --stack-name GreenGovRAGStack \
            --query 'Stacks[0].Outputs[?OutputKey==`ClusterName`].OutputValue' \
            --output text \
            --region ${{ vars.AWS_REGION }})

          SERVICE_NAME=$(aws cloudformation describe-stacks \
            --stack-name GreenGovRAGStack \
            --query 'Stacks[0].Outputs[?OutputKey==`BackendServiceName`].OutputValue' \
            --output text \
            --region ${{ vars.AWS_REGION }})

          aws ecs update-service \
            --cluster "$CLUSTER_NAME" \
            --service "$SERVICE_NAME" \
            --force-new-deployment \
            --region ${{ vars.AWS_REGION }}

      - name: Wait for ECS service stability
        run: |
          # Get cluster and service names from CloudFormation stack outputs
          CLUSTER_NAME=$(aws cloudformation describe-stacks \
            --stack-name GreenGovRAGStack \
            --query 'Stacks[0].Outputs[?OutputKey==`ClusterName`].OutputValue' \
            --output text \
            --region ${{ vars.AWS_REGION }})

          SERVICE_NAME=$(aws cloudformation describe-stacks \
            --stack-name GreenGovRAGStack \
            --query 'Stacks[0].Outputs[?OutputKey==`BackendServiceName`].OutputValue' \
            --output text \
            --region ${{ vars.AWS_REGION }})

          aws ecs wait services-stable \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME" \
            --region ${{ vars.AWS_REGION }}

      - name: Get deployment status
        run: |
          # Get cluster and service names from CloudFormation stack outputs
          CLUSTER_NAME=$(aws cloudformation describe-stacks \
            --stack-name GreenGovRAGStack \
            --query 'Stacks[0].Outputs[?OutputKey==`ClusterName`].OutputValue' \
            --output text \
            --region ${{ vars.AWS_REGION }})

          SERVICE_NAME=$(aws cloudformation describe-stacks \
            --stack-name GreenGovRAGStack \
            --query 'Stacks[0].Outputs[?OutputKey==`BackendServiceName`].OutputValue' \
            --output text \
            --region ${{ vars.AWS_REGION }})

          aws ecs describe-services \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME" \
            --region ${{ vars.AWS_REGION }} \
            --query 'services[0].deployments' \
            --output table

      - name: Run post-deployment health check
        run: |
          # Get ALB URL from CloudFormation outputs
          ALB_URL=$(aws cloudformation describe-stacks \
            --stack-name GreenGovRAGStack \
            --query 'Stacks[0].Outputs[?OutputKey==`LoadBalancerDNS`].OutputValue' \
            --output text \
            --region ${{ vars.AWS_REGION }})

          echo "::add-mask::${ALB_URL}"
          
          # Health check
           echo "Running health check on backend..."
          if curl -f "${ALB_URL}/api/health" --max-time 30 --silent --show-error; then
            echo "✓ Backend is healthy"
          else
            echo "✗ Health check failed"
            exit 1
          fi
          echo "✓ Deployment successful!"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed! Check logs above for details."
          # Add Slack/email notification here if needed

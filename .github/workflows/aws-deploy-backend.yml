name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/docker/backend.Dockerfile'
      - 'deploy/aws/**'
      - '.github/workflows/aws-deploy-backend.yml'
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: greengovrag-backend

jobs:
  deploy:
    if: false  # Change to true to enable deployment
    name: Deploy Backend to AWS ECS
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build Docker image
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -f deploy/docker/backend.Dockerfile \
            .

          # Push image to ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy CDK Stack with Secrets
        env:
          API_ACCESS_KEY: ${{ secrets.API_ACCESS_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        run: |
          cd deploy/aws

          # Deploy stack with secrets passed as context
          cdk deploy --require-approval never \
            --context api_access_key="${API_ACCESS_KEY}" \
            --context azure_openai_api_key="${AZURE_OPENAI_API_KEY}" \
            --context azure_openai_endpoint="${AZURE_OPENAI_ENDPOINT}" \
            --context llm_provider="${LLM_PROVIDER:-azure}" \
            --context llm_model="${LLM_MODEL:-gpt-5-mini}" \
            --context azure_openai_deployment="${AZURE_OPENAI_DEPLOYMENT:-gpt-5-mini}" \
            --context embedding_model="${EMBEDDING_MODEL:-BAAI/bge-large-en-v1.5}"

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster GreenGovRAG-Cluster \
            --service GreenGovRAG-BackendService \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster GreenGovRAG-Cluster \
            --services GreenGovRAG-BackendService \
            --region ${{ env.AWS_REGION }}

      - name: Get deployment status
        run: |
          aws ecs describe-services \
            --cluster GreenGovRAG-Cluster \
            --services GreenGovRAG-BackendService \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].deployments' \
            --output table

      - name: Run post-deployment health check
        run: |
          # Get API Gateway URL from CloudFormation outputs
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name GreenGovRAGStack \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiGatewayURL`].OutputValue' \
            --output text \
            --region ${{ env.AWS_REGION }})

          # Health check
          echo "Checking health at: ${API_URL}/api/health"
          curl -f "${API_URL}/api/health" || exit 1
          echo "✓ Deployment successful!"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed! Check logs above for details."
          # Add Slack/email notification here if needed

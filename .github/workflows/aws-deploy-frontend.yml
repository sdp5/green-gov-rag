name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/aws-deploy-frontend.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Backend"]
    types: [completed]
    branches: [main]

env:
  AWS_REGION: ap-southeast-2

jobs:
  # Ensure CI tests pass before deploying
  ci-frontend:
    uses: ./.github/workflows/ci-frontend.yml

  build:
    # Disabled - change to true to enable deployment
    if: false
    name: Build Frontend
    runs-on: ubuntu-latest
    environment: aws-prod
    needs: ci-frontend  # Wait for tests to pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          # These will be replaced at runtime via config.js
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

      - name: Generate runtime config template
        working-directory: frontend
        run: |
          # Copy config template to dist
          cp public/config.template.js dist/config.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 1

  deploy-aws:
    name: Deploy to AWS S3 + CloudFront
    needs: build
    runs-on: ubuntu-latest
    # Disabled - change to true to enable deployment
    # NOTE: This job only runs if backend deployment succeeded (workflow_run trigger)
    if: false
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get CloudFormation outputs
        id: cf-outputs
        run: |
          FRONTEND_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name GreenGovRAGStack \
            --query 'Stacks[0].Outputs[?OutputKey==`FrontendBucket`].OutputValue' \
            --output text)

          API_URL=$(aws cloudformation describe-stacks \
            --stack-name GreenGovRAGStack \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiGatewayURL`].OutputValue' \
            --output text)

          CF_DISTRIBUTION=$(aws cloudformation describe-stacks \
            --stack-name GreenGovRAGStack \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontURL`].OutputValue' \
            --output text)

          echo "bucket=$FRONTEND_BUCKET" >> $GITHUB_OUTPUT
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "cf_url=$CF_DISTRIBUTION" >> $GITHUB_OUTPUT

      - name: Generate runtime config.js
        run: |
          cat > dist/config.js << EOF
          // Runtime configuration for GreenGovRAG frontend
          // API_ACCESS_KEY is NOT included here - it's securely injected by CloudFront Function
          // The CDK stack deploys a CloudFront Function that adds the X-API-Key header to all /api/* requests
          window.__RUNTIME_CONFIG__ = {
            API_URL: '${{ steps.cf-outputs.outputs.api_url }}/api',
            MAPBOX_TOKEN: '${{ secrets.VITE_MAPBOX_TOKEN || 'pk.your-mapbox-token-here' }}',
            GITHUB_REPO_URL: 'https://github.com/sdp5/green-gov-rag'
          };
          EOF

      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://${{ steps.cf-outputs.outputs.bucket }}/ \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "index.html" \
            --exclude "config.js"

          # Upload index.html and config.js with no-cache
          aws s3 cp dist/index.html s3://${{ steps.cf-outputs.outputs.bucket }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

          aws s3 cp dist/config.js s3://${{ steps.cf-outputs.outputs.bucket }}/config.js \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          # Get distribution ID from URL
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items, '${{ steps.cf-outputs.outputs.cf_url }}')].Id" \
            --output text)

          if [ -n "$DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation \
              --distribution-id $DISTRIBUTION_ID \
              --paths "/*"
            echo "✓ CloudFront cache invalidated"
          fi

      - name: Deployment summary
        run: |
          echo "✓ Frontend deployed successfully"
          echo "URL: ${{ steps.cf-outputs.outputs.cf_url }}"
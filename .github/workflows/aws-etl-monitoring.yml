name: ETL Pipeline - Monitoring Driven

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC (matches Airflow monitoring DAG)
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2

jobs:
  # Step 1: Check for document changes
  monitor-sources-aws:
    name: Monitor Document Sources (AWS)
    runs-on: ubuntu-latest
    # Disabled - change to true to enable monitoring
    if: false
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    outputs:
      changes_detected: ${{ steps.check-changes.outputs.has_changes }}
      total_discovered: ${{ steps.check-changes.outputs.discovered }}
      total_updated: ${{ steps.check-changes.outputs.updated }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run monitoring via ECS Task
        id: run-monitoring
        run: |
          # Get cluster and task definition
          CLUSTER="GreenGovRAG-Cluster"
          TASK_FAMILY="GreenGovRAG-BackendTask"

          # Get subnet and security group
          SUBNET=$(aws ec2 describe-subnets \
            --filters "Name=tag:Name,Values=*Public*" \
            --query 'Subnets[0].SubnetId' \
            --output text)

          SG=$(aws ec2 describe-security-groups \
            --filters "Name=tag:Name,Values=*EcsSG*" \
            --query 'SecurityGroups[0].GroupId' \
            --output text)

          # Run monitoring task
          TASK_ARN=$(aws ecs run-task \
            --cluster $CLUSTER \
            --task-definition $TASK_FAMILY \
            --launch-type FARGATE \
            --platform-version LATEST \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET],securityGroups=[$SG],assignPublicIp=ENABLED}" \
            --overrides '{
              "containerOverrides": [{
                "name": "backend",
                "command": [
                  "python", "-m", "green_gov_rag.cli",
                  "etl", "monitor",
                  "--format", "json"
                ]
              }]
            }' \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "task_arn=$TASK_ARN" >> $GITHUB_OUTPUT
          echo "✓ Started monitoring task: $TASK_ARN"

      - name: Wait for monitoring task completion
        id: wait-monitoring
        run: |
          CLUSTER="GreenGovRAG-Cluster"
          TASK_ARN="${{ steps.run-monitoring.outputs.task_arn }}"

          echo "Waiting for monitoring task to complete..."

          # Wait for task to complete (max 20 minutes)
          for i in {1..40}; do
            STATUS=$(aws ecs describe-tasks \
              --cluster $CLUSTER \
              --tasks $TASK_ARN \
              --query 'tasks[0].lastStatus' \
              --output text)

            echo "[$i/40] Task status: $STATUS"

            if [ "$STATUS" == "STOPPED" ]; then
              EXIT_CODE=$(aws ecs describe-tasks \
                --cluster $CLUSTER \
                --tasks $TASK_ARN \
                --query 'tasks[0].containers[0].exitCode' \
                --output text)

              if [ "$EXIT_CODE" == "0" ]; then
                echo "✓ Monitoring task completed successfully"
                break
              else
                echo "✗ Monitoring task failed with exit code: $EXIT_CODE"
                exit 1
              fi
            fi

            sleep 30
          done

      - name: Get monitoring results from CloudWatch Logs
        id: get-results
        run: |
          TASK_ARN="${{ steps.run-monitoring.outputs.task_arn }}"
          TASK_ID=$(echo $TASK_ARN | cut -d'/' -f3)

          LOG_GROUP="/ecs/greengovrag-backend"
          LOG_STREAM="ecs/backend/$TASK_ID"

          # Wait a bit for logs to be available
          sleep 10

          # Get logs (last 100 lines should contain JSON output)
          LOGS=$(aws logs get-log-events \
            --log-group-name $LOG_GROUP \
            --log-stream-name $LOG_STREAM \
            --limit 100 \
            --query 'events[*].message' \
            --output text)

          echo "Monitoring logs:"
          echo "$LOGS"

          # Extract JSON from logs (look for monitoring results)
          # The CLI outputs JSON, so we extract it
          MONITORING_JSON=$(echo "$LOGS" | grep -A 50 '{"sources_checked"' | head -1 || echo '{}')

          echo "monitoring_results<<EOF" >> $GITHUB_OUTPUT
          echo "$MONITORING_JSON" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check if changes detected
        id: check-changes
        run: |
          RESULTS='${{ steps.get-results.outputs.monitoring_results }}'

          if [ -z "$RESULTS" ] || [ "$RESULTS" == "{}" ]; then
            echo "⚠ No monitoring results found, assuming no changes"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "discovered=0" >> $GITHUB_OUTPUT
            echo "updated=0" >> $GITHUB_OUTPUT
            echo "changed_doc_ids=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          DISCOVERED=$(echo "$RESULTS" | jq -r '.total_discovered // 0')
          UPDATED=$(echo "$RESULTS" | jq -r '.total_updated // 0')
          TOTAL=$((DISCOVERED + UPDATED))

          # Extract changed document IDs for delta indexing
          CHANGED_IDS=$(echo "$RESULTS" | jq -c '.changed_document_ids // []')

          echo "Documents discovered: $DISCOVERED"
          echo "Documents updated: $UPDATED"
          echo "Total changes: $TOTAL"
          echo "Changed document IDs: $CHANGED_IDS"

          echo "discovered=$DISCOVERED" >> $GITHUB_OUTPUT
          echo "updated=$UPDATED" >> $GITHUB_OUTPUT
          echo "changed_doc_ids=$CHANGED_IDS" >> $GITHUB_OUTPUT

          if [ "$TOTAL" -gt 0 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✓ Changes detected - ETL pipeline will be triggered"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✓ No changes detected - ETL pipeline will be skipped"
          fi

  # Step 2: Run ETL pipeline if changes detected
  etl-pipeline-aws:
    name: Run ETL Pipeline (AWS)
    needs: monitor-sources-aws
    if: needs.monitor-sources-aws.outputs.changes_detected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload config to S3
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name GreenGovRAGStack \
            --query 'Stacks[0].Outputs[?OutputKey==`DocumentsBucket`].OutputValue' \
            --output text)

          aws s3 cp configs/documents_config.yml \
            s3://${BUCKET}/configs/documents_config.yml

      - name: Create changed files JSON for delta indexing
        run: |
          CHANGED_IDS='${{ needs.monitor-sources-aws.outputs.changed_doc_ids }}'
          TOTAL_CHANGED=${{ needs.monitor-sources-aws.outputs.total_discovered }} + ${{ needs.monitor-sources-aws.outputs.total_updated }}

          echo "Creating changed_files.json with ${TOTAL_CHANGED} documents"

          cat > changed_files.json <<EOF
          {
            "changed_document_ids": ${CHANGED_IDS},
            "total_changed": ${TOTAL_CHANGED}
          }
          EOF

          cat changed_files.json

          # Upload to S3 for ECS task
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name GreenGovRAGStack \
            --query 'Stacks[0].Outputs[?OutputKey==`DocumentsBucket`].OutputValue' \
            --output text)

          aws s3 cp changed_files.json s3://${BUCKET}/configs/changed_files.json

      - name: Run ETL via ECS Task
        id: run-etl
        run: |
          # Get cluster and task definition
          CLUSTER="GreenGovRAG-Cluster"
          TASK_FAMILY="GreenGovRAG-BackendTask"

          # Get subnet and security group
          SUBNET=$(aws ec2 describe-subnets \
            --filters "Name=tag:Name,Values=*Public*" \
            --query 'Subnets[0].SubnetId' \
            --output text)

          SG=$(aws ec2 describe-security-groups \
            --filters "Name=tag:Name,Values=*EcsSG*" \
            --query 'SecurityGroups[0].GroupId' \
            --output text)

          # Get S3 bucket for environment
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name GreenGovRAGStack \
            --query 'Stacks[0].Outputs[?OutputKey==`DocumentsBucket`].OutputValue' \
            --output text)

          # Run delta ETL task (ingest to S3, parse, chunk, delta index to Qdrant)
          # Note: Documents stored in S3, vectors in Qdrant
          # Delta indexing: Only process changed documents, update vectors incrementally
          TASK_ARN=$(aws ecs run-task \
            --cluster $CLUSTER \
            --task-definition $TASK_FAMILY \
            --launch-type FARGATE \
            --platform-version LATEST \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET],securityGroups=[$SG],assignPublicIp=ENABLED}" \
            --overrides "{
              \"containerOverrides\": [{
                \"name\": \"backend\",
                \"environment\": [
                  {\"name\": \"CLOUD_PROVIDER\", \"value\": \"aws\"},
                  {\"name\": \"AWS_REGION\", \"value\": \"$AWS_REGION\"},
                  {\"name\": \"STORAGE_CONTAINER\", \"value\": \"$BUCKET\"},
                  {\"name\": \"VECTOR_STORE_TYPE\", \"value\": \"qdrant\"},
                  {\"name\": \"EMBEDDING_MODEL\", \"value\": \"${EMBEDDING_MODEL:-BAAI/bge-large-en-v1.5}\"}
                ],
                \"command\": [
                  \"sh\", \"-c\",
                  \"aws s3 cp s3://$BUCKET/configs/changed_files.json /tmp/changed_files.json && greengovrag-cli etl ingest --config /app/data/configs/documents_config.yml && greengovrag-cli etl parse --input data/raw --output data/processed && greengovrag-cli etl chunk --input data/processed --output data/chunks --chunk-size 500 --chunk-overlap 100 && greengovrag-cli rag index --chunks data/chunks --vector-store qdrant --collection greengovrag --model \\$EMBEDDING_MODEL --changed-files /tmp/changed_files.json --mode delta\"
                ]
              }]
            }" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "task_arn=$TASK_ARN" >> $GITHUB_OUTPUT
          echo "✓ Started ETL task: $TASK_ARN"

      - name: Monitor ETL task
        run: |
          CLUSTER="GreenGovRAG-Cluster"
          TASK_ARN="${{ steps.run-etl.outputs.task_arn }}"

          echo "Monitoring task: $TASK_ARN"

          # Wait for task to complete (with timeout)
          for i in {1..60}; do
            STATUS=$(aws ecs describe-tasks \
              --cluster $CLUSTER \
              --tasks $TASK_ARN \
              --query 'tasks[0].lastStatus' \
              --output text)

            echo "[$i/60] Task status: $STATUS"

            if [ "$STATUS" == "STOPPED" ]; then
              EXIT_CODE=$(aws ecs describe-tasks \
                --cluster $CLUSTER \
                --tasks $TASK_ARN \
                --query 'tasks[0].containers[0].exitCode' \
                --output text)

              if [ "$EXIT_CODE" == "0" ]; then
                echo "✓ ETL task completed successfully"
                exit 0
              else
                echo "✗ ETL task failed with exit code: $EXIT_CODE"
                exit 1
              fi
            fi

            sleep 60
          done

          echo "✗ ETL task timeout after 60 minutes"
          exit 1

      - name: Verify Qdrant update
        if: success()
        run: |
          echo "✓ ETL pipeline completed successfully"
          echo "Discovered documents: ${{ needs.monitor-sources-aws.outputs.total_discovered }}"
          echo "Updated documents: ${{ needs.monitor-sources-aws.outputs.total_updated }}"

  # Summary job
  summary:
    name: Monitoring Summary
    needs: [monitor-sources-aws, etl-pipeline-aws]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Print summary
        run: |
          echo "=== Monitoring-Driven ETL Summary ==="
          echo ""
          echo "Changes detected: ${{ needs.monitor-sources-aws.outputs.changes_detected }}"
          echo "Documents discovered: ${{ needs.monitor-sources-aws.outputs.total_discovered }}"
          echo "Documents updated: ${{ needs.monitor-sources-aws.outputs.total_updated }}"
          echo ""

          if [ "${{ needs.monitor-sources-aws.outputs.changes_detected }}" == "true" ]; then
            if [ "${{ needs.etl-pipeline-aws.result }}" == "success" ]; then
              echo "✓ ETL pipeline completed successfully"
            elif [ "${{ needs.etl-pipeline-aws.result }}" == "failure" ]; then
              echo "✗ ETL pipeline failed"
            else
              echo "⚠ ETL pipeline status: ${{ needs.etl-pipeline-aws.result }}"
            fi
          else
            echo "✓ No changes detected - ETL skipped"
          fi

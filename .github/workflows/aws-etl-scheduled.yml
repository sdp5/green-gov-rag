name: ETL Pipeline - Scheduled

on:
  schedule:
    - cron: '30 15 */2 * *'  # Every two days at 2 AM ACDT
  workflow_dispatch:
    inputs:
      config_path:
        description: 'Path to documents config'
        default: 'configs/documents_config.yml'
        required: false

env:
  AWS_REGION: ap-southeast-2
  CONFIG_PATH: ${{ github.event.inputs.config_path || 'configs/documents_config.yml' }}

jobs:
  etl-aws:
    name: Run ETL on AWS
    runs-on: ubuntu-latest
    # Disabled - change to true to enable ETL pipeline
    if: false
    timeout-minutes: 360
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload config to S3
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name GreenGovRAGStack \
            --query 'Stacks[0].Outputs[?OutputKey==`DocumentsBucket`].OutputValue' \
            --output text)

          aws s3 cp ${{ env.CONFIG_PATH }} \
            s3://${BUCKET}/configs/documents_config.yml

      - name: Run ETL via ECS Task
        id: run-etl
        run: |
          # Get cluster and task definition
          CLUSTER="GreenGovRAG-Cluster"
          TASK_FAMILY="GreenGovRAG-BackendTask"

          # Get subnet and security group
          SUBNET=$(aws ec2 describe-subnets \
            --filters "Name=tag:Name,Values=*Public*" \
            --query 'Subnets[0].SubnetId' \
            --output text)

          SG=$(aws ec2 describe-security-groups \
            --filters "Name=tag:Name,Values=*EcsSG*" \
            --query 'SecurityGroups[0].GroupId' \
            --output text)

          # Get S3 bucket for environment
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name GreenGovRAGStack \
            --query 'Stacks[0].Outputs[?OutputKey==`DocumentsBucket`].OutputValue' \
            --output text)

          # Run ETL task (ingest to S3, parse, chunk, index to Qdrant)
          # Note: Documents stored in S3, vectors in Qdrant
          TASK_ARN=$(aws ecs run-task \
            --cluster $CLUSTER \
            --task-definition $TASK_FAMILY \
            --launch-type FARGATE \
            --platform-version LATEST \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET],securityGroups=[$SG],assignPublicIp=ENABLED}" \
            --overrides "{
              \"containerOverrides\": [{
                \"name\": \"backend\",
                \"environment\": [
                  {\"name\": \"CLOUD_PROVIDER\", \"value\": \"aws\"},
                  {\"name\": \"AWS_REGION\", \"value\": \"$AWS_REGION\"},
                  {\"name\": \"STORAGE_CONTAINER\", \"value\": \"$BUCKET\"},
                  {\"name\": \"VECTOR_STORE_TYPE\", \"value\": \"qdrant\"},
                  {\"name\": \"EMBEDDING_MODEL\", \"value\": \"${EMBEDDING_MODEL:-BAAI/bge-large-en-v1.5}\"}
                ],
                \"command\": [
                  \"sh\", \"-c\",
                  \"greengovrag-cli etl ingest --config /app/data/configs/documents_config.yml && greengovrag-cli etl parse --input data/raw --output data/processed && greengovrag-cli etl chunk --input data/processed --output data/chunks --chunk-size 500 --chunk-overlap 100 --mode delta --accurate --raw-dir data/raw && greengovrag-cli db load-chunks --chunks-dir data/chunks --batch-size 100 && greengovrag-cli rag index --chunks data/chunks --vector-store qdrant --collection greengovrag --model \\$EMBEDDING_MODEL\"
                ]
              }]
            }" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "task_arn=$TASK_ARN" >> $GITHUB_OUTPUT
          echo "✓ Started ETL task: $TASK_ARN"

      - name: Monitor ETL task
        run: |
          CLUSTER="GreenGovRAG-Cluster"
          TASK_ARN="${{ steps.run-etl.outputs.task_arn }}"

          echo "Monitoring task: $TASK_ARN"

          # Wait for task to complete (with timeout)
          for i in {1..60}; do
            STATUS=$(aws ecs describe-tasks \
              --cluster $CLUSTER \
              --tasks $TASK_ARN \
              --query 'tasks[0].lastStatus' \
              --output text)

            echo "[$i/60] Task status: $STATUS"

            if [ "$STATUS" == "STOPPED" ]; then
              EXIT_CODE=$(aws ecs describe-tasks \
                --cluster $CLUSTER \
                --tasks $TASK_ARN \
                --query 'tasks[0].containers[0].exitCode' \
                --output text)

              if [ "$EXIT_CODE" == "0" ]; then
                echo "✓ ETL task completed successfully"
                exit 0
              else
                echo "✗ ETL task failed with exit code: $EXIT_CODE"
                exit 1
              fi
            fi

            sleep 60
          done

          echo "✗ ETL task timeout after 60 minutes"
          exit 1

      - name: Verify Qdrant update
        if: success()
        run: |
          # Get Qdrant instance IP (via SSM if configured)
          # For now, just log success
          echo "✓ ETL pipeline completed successfully"
          echo "Check Qdrant collection for updated documents"

      - name: Notify on failure
        if: failure()
        run: |
          echo "✗ ETL pipeline failed. Check logs above for details."
          # Add Slack/email notification here
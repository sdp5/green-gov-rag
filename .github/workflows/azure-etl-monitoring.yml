name: ETL Pipeline - Monitoring Driven

on:
  schedule:
    - cron: '30 15 * * 0,4'  # Sun,Thu at 2 AM ACDT
  workflow_dispatch:

jobs:
  # Azure monitoring
  monitor-sources-azure:
    name: Monitor Document Sources (Azure)
    runs-on: ubuntu-latest
    # Disabled - change to true to enable monitoring
    if: false
    timeout-minutes: 360
    outputs:
      changes_detected: ${{ steps.check-changes.outputs.has_changes }}
      total_discovered: ${{ steps.check-changes.outputs.discovered }}
      total_updated: ${{ steps.check-changes.outputs.updated }}
      changed_doc_ids: ${{ steps.check-changes.outputs.changed_doc_ids }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Azure resources
        id: azure-resources
        run: |
          echo "resource_group=${{ secrets.AZURE_RESOURCE_GROUP }}" >> $GITHUB_OUTPUT
          echo "monitoring_job=greengovrag-monitoring-job" >> $GITHUB_OUTPUT
          echo "etl_job=greengovrag-etl-job" >> $GITHUB_OUTPUT

      - name: Run monitoring via Azure Container App Job
        id: run-monitoring
        run: |
          # Start job execution
          JOB_EXECUTION=$(az containerapp job start \
            --name ${{ steps.azure-resources.outputs.monitoring_job }} \
            --resource-group ${{ steps.azure-resources.outputs.resource_group }} \
            --query 'name' \
            --output tsv)

          echo "job_execution=$JOB_EXECUTION" >> $GITHUB_OUTPUT
          echo "✓ Started monitoring job: $JOB_EXECUTION"

      - name: Wait for monitoring job completion
        id: wait-monitoring
        run: |
          JOB_EXECUTION="${{ steps.run-monitoring.outputs.job_execution }}"
          echo "Waiting for monitoring job to complete..."

          # Wait for job completion (max 20 minutes)
          for i in {1..40}; do
            STATUS=$(az containerapp job execution show \
              --name ${{ steps.azure-resources.outputs.monitoring_job }} \
              --resource-group ${{ steps.azure-resources.outputs.resource_group }} \
              --job-execution-name $JOB_EXECUTION \
              --query 'properties.status' \
              --output tsv)

            echo "[$i/40] Job status: $STATUS"

            if [ "$STATUS" == "Succeeded" ]; then
              echo "✓ Monitoring job completed successfully"
              break
            elif [ "$STATUS" == "Failed" ]; then
              echo "✗ Monitoring job failed"
              exit 1
            fi

            sleep 30
          done

      - name: Get monitoring results from logs
        id: get-results
        run: |
          JOB_EXECUTION="${{ steps.run-monitoring.outputs.job_execution }}"

          # Get logs from Azure Container App
          LOGS=$(az containerapp job execution logs show \
            --name ${{ steps.azure-resources.outputs.monitoring_job }} \
            --resource-group ${{ steps.azure-resources.outputs.resource_group }} \
            --job-execution-name $JOB_EXECUTION \
            --query 'logs[*].message' \
            --output tsv)

          echo "Monitoring logs:"
          echo "$LOGS"

          # Extract JSON from logs
          MONITORING_JSON=$(echo "$LOGS" | grep -A 50 '{"sources_checked"' | head -1 || echo '{}')

          echo "monitoring_results<<EOF" >> $GITHUB_OUTPUT
          echo "$MONITORING_JSON" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check if changes detected
        id: check-changes
        run: |
          RESULTS='${{ steps.get-results.outputs.monitoring_results }}'

          if [ -z "$RESULTS" ] || [ "$RESULTS" == "{}" ]; then
            echo "⚠ No monitoring results found, assuming no changes"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "discovered=0" >> $GITHUB_OUTPUT
            echo "updated=0" >> $GITHUB_OUTPUT
            echo "changed_doc_ids=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          DISCOVERED=$(echo "$RESULTS" | jq -r '.total_discovered // 0')
          UPDATED=$(echo "$RESULTS" | jq -r '.total_updated // 0')
          TOTAL=$((DISCOVERED + UPDATED))

          # Extract changed document IDs for delta indexing
          CHANGED_IDS=$(echo "$RESULTS" | jq -c '.changed_document_ids // []')

          echo "Documents discovered: $DISCOVERED"
          echo "Documents updated: $UPDATED"
          echo "Total changes: $TOTAL"
          echo "Changed document IDs: $CHANGED_IDS"

          echo "discovered=$DISCOVERED" >> $GITHUB_OUTPUT
          echo "updated=$UPDATED" >> $GITHUB_OUTPUT
          echo "changed_doc_ids=$CHANGED_IDS" >> $GITHUB_OUTPUT

          if [ "$TOTAL" -gt 0 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✓ Changes detected - ETL pipeline will be triggered"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✓ No changes detected - ETL pipeline will be skipped"
          fi

  # Step 2: Run ETL pipeline if changes detected
  etl-pipeline-azure:
    name: Run ETL Pipeline (Azure)
    needs: monitor-sources-azure
    if: needs.monitor-sources-azure.outputs.changes_detected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Azure resources
        id: azure-resources
        run: |
          echo "resource_group=${{ secrets.AZURE_RESOURCE_GROUP }}" >> $GITHUB_OUTPUT
          echo "etl_job=greengovrag-etl-job" >> $GITHUB_OUTPUT
          echo "storage_account=${{ secrets.AZURE_STORAGE_ACCOUNT }}" >> $GITHUB_OUTPUT

      - name: Upload config to Blob Storage
        run: |
          az storage blob upload \
            --account-name ${{ steps.azure-resources.outputs.storage_account }} \
            --container-name configs \
            --name documents_config.yml \
            --file configs/documents_config.yml \
            --overwrite

      - name: Create changed files JSON for delta indexing
        run: |
          CHANGED_IDS='${{ needs.monitor-sources-azure.outputs.changed_doc_ids }}'
          TOTAL_CHANGED=${{ needs.monitor-sources-azure.outputs.total_discovered }} + ${{ needs.monitor-sources-azure.outputs.total_updated }}

          echo "Creating changed_files.json with ${TOTAL_CHANGED} documents"

          cat > changed_files.json <<EOF
          {
            "changed_document_ids": ${CHANGED_IDS},
            "total_changed": ${TOTAL_CHANGED}
          }
          EOF

          cat changed_files.json

          # Upload to Azure Blob Storage
          az storage blob upload \
            --account-name ${{ steps.azure-resources.outputs.storage_account }} \
            --container-name configs \
            --name changed_files.json \
            --file changed_files.json \
            --overwrite

      - name: Run ETL via Azure Container App Job
        id: run-etl-azure
        run: |
          echo "Starting Azure Container App Job: ${{ steps.azure-resources.outputs.etl_job }}"
          echo ""
          echo "Note: The Container App Job must be configured with the following command:"
          echo "  greengovrag-cli etl ingest --config /app/configs/documents_config.yml && \"
          echo "  greengovrag-cli etl parse --input data/raw --output data/processed && \"
          echo "  greengovrag-cli etl chunk --input data/processed --output data/chunks --chunk-size 500 --chunk-overlap 100 --mode delta --accurate --raw-dir data/raw && \"
          echo "  greengovrag-cli rag index --chunks data/chunks --vector-store qdrant --collection greengovrag --model \$EMBEDDING_MODEL --changed-files /tmp/changed_files.json --mode delta"
          echo ""
          echo "This ensures the full ETL pipeline: ingest → parse → chunk → index"
          echo "Delta mode uses changed_files.json uploaded to /tmp/changed_files.json by previous step"
          echo ""

          # Start the ETL job execution
          JOB_EXECUTION=$(az containerapp job start \
            --name ${{ steps.azure-resources.outputs.etl_job }} \
            --resource-group ${{ steps.azure-resources.outputs.resource_group }} \
            --query 'name' \
            --output tsv)

          echo "job_execution=$JOB_EXECUTION" >> $GITHUB_OUTPUT
          echo "✓ Started ETL job execution: $JOB_EXECUTION"

      - name: Monitor ETL job execution
        run: |
          JOB_EXECUTION="${{ steps.run-etl-azure.outputs.job_execution }}"
          echo "Monitoring Azure Container App Job execution..."

          # Poll job status (max 60 minutes = 120 polls at 30s intervals)
          for i in {1..120}; do
            STATUS=$(az containerapp job execution show \
              --name ${{ steps.azure-resources.outputs.etl_job }} \
              --resource-group ${{ steps.azure-resources.outputs.resource_group }} \
              --job-execution-name $JOB_EXECUTION \
              --query 'properties.status' \
              --output tsv)

            echo "[$i/120] Job status: $STATUS"

            if [ "$STATUS" == "Succeeded" ]; then
              echo "✓ ETL job completed successfully"
              exit 0
            elif [ "$STATUS" == "Failed" ]; then
              echo "✗ ETL job failed"

              # Get logs for debugging
              echo "Fetching logs..."
              az containerapp job execution logs show \
                --name ${{ steps.azure-resources.outputs.etl_job }} \
                --resource-group ${{ steps.azure-resources.outputs.resource_group }} \
                --job-execution-name $JOB_EXECUTION \
                --tail 50

              exit 1
            fi

            sleep 30
          done

          echo "✗ ETL job timeout after 60 minutes"
          exit 1

      - name: Get ETL job logs
        if: success()
        run: |
          echo "Fetching ETL job logs (last 100 lines)..."
          az containerapp job execution logs show \
            --name ${{ steps.azure-resources.outputs.etl_job }} \
            --resource-group ${{ steps.azure-resources.outputs.resource_group }} \
            --job-execution-name ${{ steps.run-etl-azure.outputs.job_execution }} \
            --tail 100

      - name: Verify Qdrant update
        if: success()
        run: |
          echo "✓ ETL pipeline completed successfully on Azure"
          echo "Discovered documents: ${{ needs.monitor-sources-azure.outputs.total_discovered }}"
          echo "Updated documents: ${{ needs.monitor-sources-azure.outputs.total_updated }}"

  # Summary job
  summary:
    name: Monitoring Summary
    needs: [monitor-sources-azure, etl-pipeline-azure]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Print summary
        run: |
          echo "=== Monitoring-Driven ETL Summary ==="
          echo ""
          echo "Changes detected: ${{ needs.monitor-sources-azure.outputs.changes_detected }}"
          echo "Documents discovered: ${{ needs.monitor-sources-azure.outputs.total_discovered }}"
          echo "Documents updated: ${{ needs.monitor-sources-azure.outputs.total_updated }}"
          echo ""

          if [ "${{ needs.monitor-sources-azure.outputs.changes_detected }}" == "true" ]; then
            if [ "${{ needs.etl-pipeline-azure.result }}" == "success" ]; then
              echo "✓ ETL pipeline completed successfully"
            elif [ "${{ needs.etl-pipeline-azure.result }}" == "failure" ]; then
              echo "✗ ETL pipeline failed"
            else
              echo "⚠ ETL pipeline status: ${{ needs.etl-pipeline-azure.result }}"
            fi
          else
            echo "✓ No changes detected - ETL skipped"
          fi
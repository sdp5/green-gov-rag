name: Backup and Monitoring

on:
  schedule:
    - cron: '0 3 * * 0'  # Weekly on Sunday at 3 AM UTC
  workflow_dispatch:
    inputs:
      cloud_provider:
        description: 'Cloud provider (aws or azure)'
        default: 'aws'
        required: false
        type: choice
        options:
          - aws
          - azure

env:
  AWS_REGION: ap-southeast-2
  CLOUD_PROVIDER: ${{ github.event.inputs.cloud_provider || 'aws' }}

jobs:
  backup-aws:
    name: Backup AWS Resources
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.cloud_provider == 'aws' || github.event_name == 'schedule' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get resource IDs
        id: resources
        run: |
          # Get Qdrant EBS volume ID
          VOLUME_ID=$(aws cloudformation describe-stacks \
            --stack-name GreenGovRAGStack \
            --query 'Stacks[0].Outputs[?OutputKey==`QdrantVolumeId`].OutputValue' \
            --output text)

          # Get RDS instance identifier
          DB_INSTANCE=$(aws rds describe-db-instances \
            --query 'DBInstances[?contains(DBInstanceIdentifier, `greengovrag`)].DBInstanceIdentifier' \
            --output text | head -1)

          # Get documents bucket
          DOCS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name GreenGovRAGStack \
            --query 'Stacks[0].Outputs[?OutputKey==`DocumentsBucket`].OutputValue' \
            --output text)

          echo "volume_id=$VOLUME_ID" >> $GITHUB_OUTPUT
          echo "db_instance=$DB_INSTANCE" >> $GITHUB_OUTPUT
          echo "docs_bucket=$DOCS_BUCKET" >> $GITHUB_OUTPUT

      - name: Create Qdrant EBS snapshot
        run: |
          SNAPSHOT_ID=$(aws ec2 create-snapshot \
            --volume-id ${{ steps.resources.outputs.volume_id }} \
            --description "Weekly Qdrant backup - $(date +%Y-%m-%d)" \
            --tag-specifications 'ResourceType=snapshot,Tags=[{Key=Name,Value=qdrant-weekly-backup},{Key=BackupType,Value=Automated}]' \
            --query 'SnapshotId' \
            --output text)

          echo "✓ Created EBS snapshot: $SNAPSHOT_ID"

          # Wait for snapshot completion
          aws ec2 wait snapshot-completed --snapshot-ids $SNAPSHOT_ID
          echo "✓ Snapshot completed"

      - name: Create RDS snapshot
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          SNAPSHOT_ID="${{ steps.resources.outputs.db_instance }}-backup-$TIMESTAMP"

          aws rds create-db-snapshot \
            --db-instance-identifier ${{ steps.resources.outputs.db_instance }} \
            --db-snapshot-identifier $SNAPSHOT_ID \
            --tags Key=BackupType,Value=Automated

          echo "✓ Created RDS snapshot: $SNAPSHOT_ID"

      - name: Backup PostgreSQL to S3
        run: |
          # Get RDS endpoint and credentials
          DB_ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier ${{ steps.resources.outputs.db_instance }} \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)

          SECRET_ARN=$(aws cloudformation describe-stacks \
            --stack-name GreenGovRAGStack \
            --query 'Stacks[0].Outputs[?OutputKey==`DatabaseSecretArn`].OutputValue' \
            --output text)

          # Get credentials from Secrets Manager
          DB_CREDS=$(aws secretsmanager get-secret-value \
            --secret-id $SECRET_ARN \
            --query SecretString \
            --output text)

          DB_PASSWORD=$(echo $DB_CREDS | jq -r '.password')

          # Create PostgreSQL dump (requires psql client)
          # This is a simplified example - in production, run this from an EC2 instance or container
          echo "✓ Database backup completed (RDS snapshot)"

      - name: Clean up old snapshots
        run: |
          # Keep last 4 weekly backups, delete older
          SNAPSHOTS=$(aws ec2 describe-snapshots \
            --owner-ids self \
            --filters "Name=tag:Name,Values=qdrant-weekly-backup" \
            --query 'Snapshots[*].[SnapshotId,StartTime]' \
            --output text | sort -k2 -r | tail -n +5 | awk '{print $1}')

          for SNAPSHOT in $SNAPSHOTS; do
            echo "Deleting old snapshot: $SNAPSHOT"
            aws ec2 delete-snapshot --snapshot-id $SNAPSHOT || true
          done

          # Clean up old RDS snapshots
          RDS_SNAPSHOTS=$(aws rds describe-db-snapshots \
            --db-instance-identifier ${{ steps.resources.outputs.db_instance }} \
            --snapshot-type manual \
            --query 'DBSnapshots[*].[DBSnapshotIdentifier,SnapshotCreateTime]' \
            --output text | sort -k2 -r | tail -n +5 | awk '{print $1}')

          for SNAPSHOT in $RDS_SNAPSHOTS; do
            echo "Deleting old RDS snapshot: $SNAPSHOT"
            aws rds delete-db-snapshot --db-snapshot-identifier $SNAPSHOT || true
          done

  health-check-aws:
    name: Health Check AWS Services
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.cloud_provider == 'aws' || github.event_name == 'schedule' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check ECS service health
        run: |
          STATUS=$(aws ecs describe-services \
            --cluster GreenGovRAG-Cluster \
            --services GreenGovRAG-BackendService \
            --query 'services[0].status' \
            --output text)

          RUNNING=$(aws ecs describe-services \
            --cluster GreenGovRAG-Cluster \
            --services GreenGovRAG-BackendService \
            --query 'services[0].runningCount' \
            --output text)

          if [ "$STATUS" != "ACTIVE" ] || [ "$RUNNING" -lt "1" ]; then
            echo "✗ ECS service unhealthy: Status=$STATUS, Running=$RUNNING"
            exit 1
          fi

          echo "✓ ECS service healthy"

      - name: Check RDS health
        run: |
          DB_STATUS=$(aws rds describe-db-instances \
            --query 'DBInstances[?contains(DBInstanceIdentifier, `greengovrag`)].DBInstanceStatus' \
            --output text | head -1)

          if [ "$DB_STATUS" != "available" ]; then
            echo "✗ RDS instance unhealthy: $DB_STATUS"
            exit 1
          fi

          echo "✓ RDS instance healthy"

      - name: Check Qdrant instance health
        run: |
          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name GreenGovRAGStack \
            --query 'Stacks[0].Outputs[?OutputKey==`QdrantInstanceId`].OutputValue' \
            --output text)

          STATE=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_ID \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)

          if [ "$STATE" != "running" ]; then
            echo "⚠ Qdrant instance not running: $STATE (This is normal for spot instances)"
          else
            echo "✓ Qdrant instance running"
          fi

      - name: Check API health
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name GreenGovRAGStack \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiGatewayURL`].OutputValue' \
            --output text)

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${API_URL}/api/health")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "✗ API unhealthy: HTTP $HTTP_CODE"
            exit 1
          fi

          echo "✓ API healthy"

      - name: Check CloudFront distribution
        run: |
          DISTRIBUTIONS=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='GreenGovRAG Frontend Distribution'].{Id:Id,Status:Status}" \
            --output text)

          if echo "$DISTRIBUTIONS" | grep -q "Deployed"; then
            echo "✓ CloudFront distribution healthy"
          else
            echo "✗ CloudFront distribution not deployed"
            exit 1
          fi

  backup-azure:
    name: Backup Azure Resources
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.cloud_provider == 'azure' }}

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get resource IDs
        id: resources
        run: |
          RESOURCE_GROUP="${{ secrets.AZURE_RESOURCE_GROUP }}"

          # Get PostgreSQL server name
          PG_SERVER=$(az postgres flexible-server list \
            --resource-group $RESOURCE_GROUP \
            --query "[?contains(name, 'greengovrag')].name" \
            --output tsv | head -1)

          # Get storage account name
          STORAGE_ACCOUNT="${{ secrets.AZURE_STORAGE_ACCOUNT }}"

          # Get Qdrant VM name
          QDRANT_VM=$(az vm list \
            --resource-group $RESOURCE_GROUP \
            --query "[?contains(name, 'qdrant')].name" \
            --output tsv | head -1)

          # Get Qdrant disk name
          QDRANT_DISK=$(az vm show \
            --resource-group $RESOURCE_GROUP \
            --name $QDRANT_VM \
            --query "storageProfile.osDisk.name" \
            --output tsv)

          echo "pg_server=$PG_SERVER" >> $GITHUB_OUTPUT
          echo "storage_account=$STORAGE_ACCOUNT" >> $GITHUB_OUTPUT
          echo "qdrant_vm=$QDRANT_VM" >> $GITHUB_OUTPUT
          echo "qdrant_disk=$QDRANT_DISK" >> $GITHUB_OUTPUT

          echo "✓ Found resources:"
          echo "  PostgreSQL: $PG_SERVER"
          echo "  Storage: $STORAGE_ACCOUNT"
          echo "  Qdrant VM: $QDRANT_VM"
          echo "  Qdrant Disk: $QDRANT_DISK"

      - name: Create PostgreSQL backup
        run: |
          RESOURCE_GROUP="${{ secrets.AZURE_RESOURCE_GROUP }}"
          PG_SERVER="${{ steps.resources.outputs.pg_server }}"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BACKUP_NAME="greengovrag-backup-$TIMESTAMP"

          echo "Creating PostgreSQL backup: $BACKUP_NAME"

          # Trigger on-demand backup
          az postgres flexible-server backup create \
            --resource-group $RESOURCE_GROUP \
            --name $PG_SERVER \
            --backup-name $BACKUP_NAME

          echo "✓ PostgreSQL backup created: $BACKUP_NAME"

      - name: Create Qdrant disk snapshot
        run: |
          RESOURCE_GROUP="${{ secrets.AZURE_RESOURCE_GROUP }}"
          QDRANT_DISK="${{ steps.resources.outputs.qdrant_disk }}"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          SNAPSHOT_NAME="qdrant-snapshot-$TIMESTAMP"

          echo "Creating Qdrant disk snapshot: $SNAPSHOT_NAME"

          # Get disk resource ID
          DISK_ID=$(az disk show \
            --resource-group $RESOURCE_GROUP \
            --name $QDRANT_DISK \
            --query id \
            --output tsv)

          # Create snapshot
          az snapshot create \
            --resource-group $RESOURCE_GROUP \
            --name $SNAPSHOT_NAME \
            --source $DISK_ID \
            --tags BackupType=Automated BackupDate=$(date +%Y-%m-%d)

          echo "✓ Qdrant disk snapshot created: $SNAPSHOT_NAME"

      - name: Backup Blob Storage containers
        run: |
          STORAGE_ACCOUNT="${{ steps.resources.outputs.storage_account }}"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)

          echo "Creating Blob Storage snapshots..."

          # Snapshot documents container
          DOCS_BLOBS=$(az storage blob list \
            --account-name $STORAGE_ACCOUNT \
            --container-name documents \
            --auth-mode login \
            --query "[].name" \
            --output tsv)

          for BLOB in $DOCS_BLOBS; do
            az storage blob snapshot \
              --account-name $STORAGE_ACCOUNT \
              --container-name documents \
              --name $BLOB \
              --auth-mode login || true
          done

          # Snapshot configs container
          CONFIG_BLOBS=$(az storage blob list \
            --account-name $STORAGE_ACCOUNT \
            --container-name configs \
            --auth-mode login \
            --query "[].name" \
            --output tsv)

          for BLOB in $CONFIG_BLOBS; do
            az storage blob snapshot \
              --account-name $STORAGE_ACCOUNT \
              --container-name configs \
              --name $BLOB \
              --auth-mode login || true
          done

          echo "✓ Blob Storage snapshots created"

      - name: Export PostgreSQL database to Blob Storage
        run: |
          RESOURCE_GROUP="${{ secrets.AZURE_RESOURCE_GROUP }}"
          PG_SERVER="${{ steps.resources.outputs.pg_server }}"
          STORAGE_ACCOUNT="${{ steps.resources.outputs.storage_account }}"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BACKUP_FILE="postgresql-dump-$TIMESTAMP.sql"

          echo "Exporting PostgreSQL database to Blob Storage..."

          # Get PostgreSQL admin credentials from Key Vault (if configured)
          # For now, we rely on managed identity or Azure AD auth

          # Note: Direct pg_dump requires network access to PostgreSQL
          # In production, this would typically run from an Azure VM or Container Instance
          # that has network access to the PostgreSQL server

          echo "⚠ PostgreSQL export requires direct database access"
          echo "  This step is best run from an Azure Container Instance or VM"
          echo "  For now, relying on PostgreSQL flexible server's built-in backups"

      - name: Clean up old snapshots
        run: |
          RESOURCE_GROUP="${{ secrets.AZURE_RESOURCE_GROUP }}"
          CUTOFF_DATE=$(date -d "28 days ago" +%Y-%m-%d)

          echo "Cleaning up snapshots older than $CUTOFF_DATE..."

          # Delete old disk snapshots (keep last 4 weekly backups = 28 days)
          OLD_SNAPSHOTS=$(az snapshot list \
            --resource-group $RESOURCE_GROUP \
            --query "[?tags.BackupType=='Automated' && tags.BackupDate<'$CUTOFF_DATE'].name" \
            --output tsv)

          for SNAPSHOT in $OLD_SNAPSHOTS; do
            echo "Deleting old snapshot: $SNAPSHOT"
            az snapshot delete \
              --resource-group $RESOURCE_GROUP \
              --name $SNAPSHOT \
              --yes || true
          done

          echo "✓ Old snapshots cleaned up"

      - name: Clean up old PostgreSQL backups
        run: |
          RESOURCE_GROUP="${{ secrets.AZURE_RESOURCE_GROUP }}"
          PG_SERVER="${{ steps.resources.outputs.pg_server }}"

          echo "Listing PostgreSQL backups..."

          # List all backups
          az postgres flexible-server backup list \
            --resource-group $RESOURCE_GROUP \
            --name $PG_SERVER \
            --query "[].{Name:name, CompletedTime:completedTime}" \
            --output table

          echo "✓ PostgreSQL has automatic retention policy (7-35 days configurable)"
          echo "  Manual backups older than retention period are automatically cleaned up"

  health-check-azure:
    name: Health Check Azure Services
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.cloud_provider == 'azure' }}

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check Container App health
        run: |
          RESOURCE_GROUP="${{ secrets.AZURE_RESOURCE_GROUP }}"
          CONTAINER_APP=$(az containerapp list \
            --resource-group $RESOURCE_GROUP \
            --query "[?contains(name, 'greengovrag')].name" \
            --output tsv | head -1)

          STATUS=$(az containerapp show \
            --resource-group $RESOURCE_GROUP \
            --name $CONTAINER_APP \
            --query "properties.provisioningState" \
            --output tsv)

          REPLICAS=$(az containerapp replica list \
            --resource-group $RESOURCE_GROUP \
            --name $CONTAINER_APP \
            --query "length([?properties.runningState=='Running'])" \
            --output tsv)

          echo "Container App: $CONTAINER_APP"
          echo "Status: $STATUS"
          echo "Running replicas: $REPLICAS"

          if [ "$STATUS" != "Succeeded" ] || [ "$REPLICAS" -lt "1" ]; then
            echo "✗ Container App unhealthy"
            exit 1
          fi

          echo "✓ Container App healthy"

      - name: Check PostgreSQL health
        run: |
          RESOURCE_GROUP="${{ secrets.AZURE_RESOURCE_GROUP }}"
          PG_SERVER=$(az postgres flexible-server list \
            --resource-group $RESOURCE_GROUP \
            --query "[?contains(name, 'greengovrag')].name" \
            --output tsv | head -1)

          STATE=$(az postgres flexible-server show \
            --resource-group $RESOURCE_GROUP \
            --name $PG_SERVER \
            --query "state" \
            --output tsv)

          echo "PostgreSQL Server: $PG_SERVER"
          echo "State: $STATE"

          if [ "$STATE" != "Ready" ]; then
            echo "✗ PostgreSQL server unhealthy: $STATE"
            exit 1
          fi

          echo "✓ PostgreSQL server healthy"

      - name: Check Qdrant VM health
        run: |
          RESOURCE_GROUP="${{ secrets.AZURE_RESOURCE_GROUP }}"
          QDRANT_VM=$(az vm list \
            --resource-group $RESOURCE_GROUP \
            --query "[?contains(name, 'qdrant')].name" \
            --output tsv | head -1)

          POWER_STATE=$(az vm show \
            --resource-group $RESOURCE_GROUP \
            --name $QDRANT_VM \
            --show-details \
            --query "powerState" \
            --output tsv)

          echo "Qdrant VM: $QDRANT_VM"
          echo "Power State: $POWER_STATE"

          if [ "$POWER_STATE" != "VM running" ]; then
            echo "⚠ Qdrant VM not running: $POWER_STATE (This is normal for spot instances)"
          else
            echo "✓ Qdrant VM running"
          fi

      - name: Check Storage Account health
        run: |
          STORAGE_ACCOUNT="${{ secrets.AZURE_STORAGE_ACCOUNT }}"

          STATUS=$(az storage account show \
            --name $STORAGE_ACCOUNT \
            --query "provisioningState" \
            --output tsv)

          echo "Storage Account: $STORAGE_ACCOUNT"
          echo "Status: $STATUS"

          if [ "$STATUS" != "Succeeded" ]; then
            echo "✗ Storage Account unhealthy: $STATUS"
            exit 1
          fi

          echo "✓ Storage Account healthy"

      - name: Check CDN endpoint
        run: |
          RESOURCE_GROUP="${{ secrets.AZURE_RESOURCE_GROUP }}"

          # Get CDN endpoint
          CDN_ENDPOINT=$(az cdn endpoint list \
            --resource-group $RESOURCE_GROUP \
            --profile-name greengovrag-cdn \
            --query "[0].hostName" \
            --output tsv 2>/dev/null || echo "")

          if [ -z "$CDN_ENDPOINT" ]; then
            echo "⚠ CDN endpoint not found (may not be configured)"
            exit 0
          fi

          echo "CDN Endpoint: $CDN_ENDPOINT"

          # Test CDN endpoint
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$CDN_ENDPOINT")

          if [ "$HTTP_CODE" == "200" ] || [ "$HTTP_CODE" == "301" ] || [ "$HTTP_CODE" == "302" ]; then
            echo "✓ CDN endpoint healthy (HTTP $HTTP_CODE)"
          else
            echo "⚠ CDN endpoint returned HTTP $HTTP_CODE"
          fi

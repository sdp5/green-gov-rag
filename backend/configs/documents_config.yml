  # ============================================================================
  # SCOPE 3 EMISSIONS GUIDANCE (ISSB/GHG Protocol - 15 Categories)
  # ============================================================================

  - title: GHG Protocol - Scope 3 Upstream Emissions Guidance
    source_url: https://ghgprotocol.org/scope-3-calculation-guidance
    download_urls:
      - https://ghgprotocol.org/sites/default/files/standards/Scope3_Calculation_Guidance_0.pdf
    jurisdiction: federal
    category: environment
    topic: emissions_reporting
    region: Australia
    sovereign: true
    esg_metadata:
      # Frameworks & Standards
      frameworks: [ISSB, GHG_Protocol, GRI]
      measurement_standard: GHG_Protocol_Scope3_Standard

      # Emission Classification (ISSB-required, NOT NGER)
      emission_scopes: [scope_3]
      greenhouse_gases: [CO2, CH4, N2O, SF6, HFCs, PFCs, NF3]

      # Scope 3 Categories (ISSB/GHG Protocol - Upstream)
      scope_3_categories:
        - purchased_goods_services     # Category 1
        - capital_goods                # Category 2
        - fuel_energy_activities       # Category 3
        - upstream_transport           # Category 4
        - waste_generated              # Category 5
        - business_travel              # Category 6
        - employee_commuting           # Category 7
        - upstream_leased_assets       # Category 8

      # Consolidation & Methodology
      consolidation_method: operational_control
      methodology_type: calculation

      # NGER-Specific (Scope 3 NOT reportable under NGER)
      reportable_under_nger: false
      scope_3_reportable: false

      # Regulatory Authority
      regulator: None  # Voluntary under ISSB/GRI
      regulation_type: guideline

      # Activity & Industry
      activity_types: [supply_chain, procurement, transport, waste]
      facility_types: [all]
      industry_codes: []
    spatial_metadata:
      spatial_scope: federal
      state: null
      lga_codes: []
      lga_names: []
      applies_to_all_lgas: true
      applies_to_point: false


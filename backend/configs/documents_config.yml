  - title: ISSB Standards - Scope 3 Reporting Requirements
    source_url: https://www.ifrs.org/issued-standards/ifrs-sustainability-standards-navigator/ifrs-s2-climate-related-disclosures/
    jurisdiction: federal
    category: regulation
    topic: emissions_reporting
    region: Australia
    sovereign: true
    esg_metadata:
      # Frameworks & Standards
      frameworks: [ISSB, GRI]
      measurement_standard: ISSB_S2_Climate_Standard

      # Emission Classification (ISSB mandatory for Scope 3)
      emission_scopes: [scope_1, scope_2, scope_3]
      greenhouse_gases: [CO2, CH4, N2O, SF6, HFCs, PFCs, NF3]

      # All 15 Scope 3 Categories (ISSB requires disclosure)
      scope_3_categories:
        - purchased_goods_services     # Category 1
        - capital_goods                # Category 2
        - fuel_energy_activities       # Category 3
        - upstream_transport           # Category 4
        - waste_generated              # Category 5
        - business_travel              # Category 6
        - employee_commuting           # Category 7
        - upstream_leased_assets       # Category 8
        - downstream_transport         # Category 9
        - processing_sold_products     # Category 10
        - use_of_sold_products         # Category 11
        - end_of_life_treatment        # Category 12
        - downstream_leased_assets     # Category 13
        - franchises                   # Category 14
        - investments                  # Category 15

      # Consolidation & Methodology (ISSB requires all 3 methods)
      consolidation_method: operational_control  # Also: equity_share, financial_control
      methodology_type: calculation

      # NGER-Specific (ISSB is separate from NGER)
      reportable_under_nger: false
      scope_3_reportable: true  # ISSB requires Scope 3

      # Regulatory Authority
      regulator: IFRS Foundation
      regulation_type: standard

      # Activity & Industry
      activity_types: [all]
      facility_types: [all]
      industry_codes: []
    spatial_metadata:
      spatial_scope: federal
      state: null
      lga_codes: []
      lga_names: []
      applies_to_all_lgas: true
      applies_to_point: false


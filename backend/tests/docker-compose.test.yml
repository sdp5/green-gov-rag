version: '3.8'

# Test database services for integration testing
# Usage (from tests/ directory):
#   docker-compose -f docker-compose.test.yml up -d
#   cd .. && pytest tests/ --integration
#   docker-compose -f docker-compose.test.yml down
#
# Or from project root:
#   cd tests && docker-compose -f docker-compose.test.yml up -d && cd ..
#   pytest tests/ --integration
#   cd tests && docker-compose -f docker-compose.test.yml down && cd ..

services:
  # PostgreSQL test database
  test-postgres:
    image: postgres:16-alpine
    container_name: greengovrag-test-postgres
    environment:
      POSTGRES_DB: greengovrag_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"
    volumes:
      - test-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d greengovrag_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Qdrant vector database (alternative to FAISS)
  test-qdrant:
    image: qdrant/qdrant:latest
    container_name: greengovrag-test-qdrant
    ports:
      - "6334:6333"  # HTTP API
      - "6335:6334"  # gRPC
    volumes:
      - test-qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__API_KEY: test-api-key
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6333/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # LocalStack for AWS service mocking (S3, Bedrock, etc.)
  test-localstack:
    image: localstack/localstack:latest
    container_name: greengovrag-test-localstack
    ports:
      - "4566:4566"  # LocalStack gateway
    environment:
      SERVICES: s3,bedrock
      DEBUG: 0
      DATA_DIR: /tmp/localstack/data
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - test-localstack-data:/tmp/localstack
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3 ls || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching test data
  test-redis:
    image: redis:7-alpine
    container_name: greengovrag-test-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  test-postgres-data:
    name: greengovrag-test-postgres-data
  test-qdrant-data:
    name: greengovrag-test-qdrant-data
  test-localstack-data:
    name: greengovrag-test-localstack-data

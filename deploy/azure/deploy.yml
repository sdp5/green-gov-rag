name: Deploy to Azure

on:
  push:
    branches:
      - main

env:
  AZURE_WEBAPP_NAME: green-gov-rag-app
  AZURE_RESOURCE_GROUP: GreenGovRAG
  AZURE_REGION: australiaeast

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t sdp5/green-gov-rag:latest .
          docker push sdp5/green-gov-rag:latest

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy App Service via Bicep
        run: |
          az group create --name $AZURE_RESOURCE_GROUP --location $AZURE_REGION
          az deployment group create \
            --resource-group $AZURE_RESOURCE_GROUP \
            --template-file deploy/azure/bicep/main.bicep \
            --parameters appName=$AZURE_WEBAPP_NAME location=$AZURE_REGION

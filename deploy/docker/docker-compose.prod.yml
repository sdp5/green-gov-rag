version: '3.8'

services:
  postgres:
    image: postgres:17.6
    container_name: greengovrag-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - greengovrag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: greengovrag-redis-prod
    networks:
      - greengovrag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    container_name: greengovrag-backend-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENV: production
    volumes:
      - ../../data:/app/data
      - ../../backend/models:/app/models
    networks:
      - greengovrag-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend.Dockerfile
    container_name: greengovrag-frontend-prod
    ports:
      - "80:80"
    networks:
      - greengovrag-network
    depends_on:
      - backend
    restart: unless-stopped

  airflow:
    build:
      context: ../..
      dockerfile: deploy/docker/airflow.Dockerfile
    container_name: greengovrag-airflow-prod
    command: airflow standalone
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ../../data:/opt/airflow/data
      - ../../backend/green_gov_rag/airflow/dags:/opt/airflow/dags
    networks:
      - greengovrag-network
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

networks:
  greengovrag-network:
    driver: bridge

volumes:
  pg_data:
    name: greengovrag_pg_data_prod

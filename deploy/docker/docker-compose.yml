# GreenGovRAG Docker Compose Configuration
#
# Default: Production-like local environment (no Airflow)
# Dev mode: docker-compose --profile dev up (includes Airflow UI)

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: greengovrag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-greengovrag}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: greengovrag-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: greengovrag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    container_name: greengovrag-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    # NOTE: BGE-large embeddings require ~3GB RAM (1.5GB model + 500MB app + 1GB headroom)
    # Docker Desktop: Ensure you have at least 4GB allocated in settings
    # Linux: No limit by default, ensure host has sufficient memory
    deploy:
      resources:
        limits:
          memory: 3G  # Safe limit for BGE-large + app stack
        reservations:
          memory: 2G  # Minimum guaranteed
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-greengovrag}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      VECTOR_STORE_TYPE: ${VECTOR_STORE_TYPE:-qdrant}
      LLM_PROVIDER: ${LLM_PROVIDER:-azure}
      LLM_MODEL: ${LLM_MODEL:-gpt-5-mini}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-5-mini}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      # Cache Settings
      ENABLE_CACHE: ${ENABLE_CACHE:-true}
      ENABLE_REDIS_CACHE: ${ENABLE_REDIS_CACHE:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TTL: ${CACHE_TTL:-3600}
      ENABLE_SEMANTIC_CACHE: ${ENABLE_SEMANTIC_CACHE:-true}
      # API Security
      API_ACCESS_KEY: ${API_ACCESS_KEY:-dev-insecure-key-change-in-prod}
      # Other Settings
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8080
      CLOUD_PROVIDER: ${CLOUD_PROVIDER:-local}
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
    volumes:
      - ../../data:/app/data
      - ../../models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Airflow - DEVELOPMENT ONLY
  # Start with: docker-compose --profile dev up
  airflow:
    build:
      context: ../..
      dockerfile: deploy/docker/airflow.Dockerfile
    container_name: greengovrag-airflow
    restart: unless-stopped
    command: airflow standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-greengovrag}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-changeme}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-5-mini}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      # Services connection
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-greengovrag}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      VECTOR_STORE_TYPE: ${VECTOR_STORE_TYPE:-qdrant}
    volumes:
      - ../../data:/opt/airflow/data
      - ../../backend/green_gov_rag/airflow/dags:/opt/airflow/dags
      - ../../backend/green_gov_rag:/opt/airflow/green_gov_rag
      - ../../configs:/opt/airflow/configs
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    profiles:
      - dev  # Only start with --profile dev
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend.Dockerfile
    container_name: greengovrag-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:8000/api
      VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    depends_on:
      - backend

volumes:
  pg_data:
    name: greengovrag_pg_data
  qdrant_data:
    name: greengovrag_qdrant_data

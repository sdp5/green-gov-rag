version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: greengovrag-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-greengovrag}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: greengovrag-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    container_name: greengovrag-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-greengovrag}
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CORS_ORIGINS: http://localhost:3000,http://localhost:8501
    volumes:
      - ../../data:/app/data
      - ../../models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  airflow:
    build:
      context: ../..
      dockerfile: deploy/docker/airflow.Dockerfile
    container_name: greengovrag-airflow
    command: airflow standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-greengovrag}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ../../data:/opt/airflow/data
      - ../../backend/green_gov_rag/airflow/dags:/opt/airflow/dags
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  streamlit:
    build:
      context: ../..
      dockerfile: deploy/docker/streamlit.Dockerfile
    container_name: greengovrag-streamlit
    ports:
      - "8501:8501"
    environment:
      API_URL: http://backend:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ../../data:/app/data
    depends_on:
      - backend

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend.Dockerfile
    container_name: greengovrag-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pg_data:
    name: greengovrag_pg_data

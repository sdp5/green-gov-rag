site_name: GreenGovRAG
site_url: https://docs.greengovrag.sundeep.id.au/
site_description: AI Assistant for Australian Environmental Regulations
site_author: Sundeep Anand
use_directory_urls: true

repo_url: https://github.com/sdp5/green-gov-rag
repo_name: sdp5/green-gov-rag

# Directory structure (mkdocs.yml is in docs/ folder)
docs_dir: docs_src
site_dir: ../site

theme:
  name: material
  palette:
    # Light mode only - Match frontend (no dark mode toggle)
    - media: "(prefers-color-scheme)"  # Force light mode regardless of system preference
      scheme: default
      primary: green
      accent: green
  font:
    text: Inter
    code: 'JetBrains Mono'
  icon:
    repo: fontawesome/brands/github
    logo: material/leaf
  features:
    # Navigation
    - navigation.instant        # XHR loading
    - navigation.instant.prefetch  # Prefetch pages
    - navigation.instant.progress  # Progress indicator
    - navigation.tracking       # URL updates
    - navigation.tabs           # Top-level tabs
    - navigation.tabs.sticky    # Sticky tabs
    # - navigation.sections     # Render sections as groups (removed for collapsible menu)
    - navigation.path           # Breadcrumbs
    - navigation.top            # Back to top button
    - navigation.footer         # Footer navigation
    - navigation.indexes        # Section index pages
    # Search
    - search.suggest            # Search suggestions
    - search.highlight          # Highlight search terms
    - search.share              # Share search results
    # Table of contents
    - toc.follow                # Follow active heading
    # - toc.integrate           # Integrate TOC into sidebar (removed for cleaner nav)
    # Content
    - content.code.copy         # Copy code blocks
    - content.code.annotate     # Code annotations
    - content.code.select       # Select code
    - content.tabs.link         # Link tabs across pages
    - content.tooltips          # Improved tooltips
    - content.action.edit       # Edit button
    - content.action.view       # View source button

plugins:
  - search:                 # Full-text search
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - mkdocstrings:          # Auto-generate API docs from docstrings
      handlers:
        python:
          paths: [../backend]  # Source code path (relative to docs/)
          options:
            docstring_style: google  # Match Ruff config
            show_source: true
            show_root_heading: true
            show_root_toc_entry: true
            heading_level: 2
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
          import:
            - https://docs.python.org/3/objects.inv
      enable_inventory: true
  - git-revision-date-localized:  # Show last updated dates
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true
  - minify:                # Minify HTML for production
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
      cache_safe: true

markdown_extensions:
  - pymdownx.highlight:    # Code highlighting
      anchor_linenums: true
  - pymdownx.superfences:  # Code blocks with tabs
      custom_fences:
        - name: mermaid    # Diagrams
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:       # Tabbed content
      alternate_style: true
  - pymdownx.tasklist:     # Task lists
      custom_checkbox: true
  - admonition             # Call-outs (notes, warnings, etc.)
  - pymdownx.details       # Collapsible admonitions
  - attr_list              # Add attributes to elements
  - md_in_html             # Markdown inside HTML
  - tables                 # Tables
  - toc:                   # Table of contents
      permalink: true
      toc_depth: 3


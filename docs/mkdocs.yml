      - Document Sources: user-guide/document-sources.md
      - Vector Stores: user-guide/vector-stores.md
      - Caching: user-guide/caching.md
      - Monitoring: user-guide/monitoring.md
      - Troubleshooting: user-guide/troubleshooting.md
  - Contributor Guide:
      - Overview: contributor-guide/overview.md
      - Development Setup: contributor-guide/dev-setup.md
      - Adding Document Sources: contributor-guide/document-sources.md
      - Code Style: contributor-guide/code-style.md
      - Testing: contributor-guide/testing.md
      - Pull Requests: contributor-guide/pull-requests.md
  - Developer Guide:
      - Architecture:
          - System Overview: developer-guide/architecture/overview.md
          - RAG Pipeline: developer-guide/architecture/rag-pipeline.md
          - ETL Pipeline: developer-guide/architecture/etl-pipeline.md
          - Plugin System: developer-guide/architecture/plugin-system.md
      - Components:
          - Metadata Standards: developer-guide/metadata-standards.md
          - Citation System: developer-guide/citations.md
          - Cloud Storage: developer-guide/cloud-storage.md
      - Customization:
          - LLM Configuration: developer-guide/llm-config.md
          - Custom Parsers: developer-guide/custom-parsers.md
          - Custom Embeddings: developer-guide/custom-embeddings.md
  - Deployment:
      - Overview: deployment/overview.md
      - Local (Docker): deployment/local-docker.md
      - AWS Deployment: deployment/aws.md
      - Azure Deployment: deployment/azure.md
      - Cloud Comparison: deployment/cloud-comparison.md
      - Production Checklist: deployment/production-checklist.md
      - Monitoring: deployment/monitoring.md
  - API Reference:
      - REST API: api-reference/rest-api.md
      - Python API:
          - RAG Module: api-reference/python/rag.md
          - ETL Module: api-reference/python/etl.md
          - Models: api-reference/python/models.md
          - Cloud Module: api-reference/python/cloud.md
  - Reference:
      - Data Sources: reference/data-sources.md
      - Plugin API: reference/plugin-api.md
      - Configuration Options: reference/config-reference.md
      - CLI Commands: reference/cli-reference.md
      - Database Schema: reference/database-schema.md
      - Glossary: reference/glossary.md
  - About:
      - Changelog: about/changelog.md
      - License: about/license.md
      - Support: about/support.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sdp5/green-gov-rag
      name: GitHub Repository
    - icon: fontawesome/solid/envelope
      link: mailto:contact@sundeep.id.au
      name: Contact Email
  version:
    provider: mike  # Versioned docs support
    default: latest
  analytics:
    provider: google
    property: G-XXXXXXXXXX  # Add your Google Analytics ID
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/thumb-up-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback!
        - icon: material/thumb-down-outline
          name: This page could be improved
          data: 0
          note: Thanks for your feedback!
  generator: false  # Remove "Made with Material for MkDocs"
  status:
    new: Recently added
    deprecated: Deprecated

# Custom CSS for professional design
extra_css:
  - stylesheets/extra.css

# Custom JavaScript (if needed)
extra_javascript:
  - javascripts/extra.js

# Exclude directories from documentation build
exclude_docs: |
  .local/
  .venv/
  archive/
  __pycache__/


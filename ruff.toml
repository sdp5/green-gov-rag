# Additional ruff configuration to temporarily ignore less critical warnings
# These should be fixed over time

# Extend per-file ignores
[lint.per-file-ignores]
"tests/*" = [
    "D103",    # Missing docstring in public function - tests don't always need docstrings
    "ANN001",  # Missing type annotation for function argument - pytest fixtures
    "ANN201",  # Missing return type annotation - test functions
    "ARG001",  # Unused function argument - pytest fixtures
    "ARG005",  # Unused lambda argument
    "BLE001",  # Do not catch blind exception - acceptable in tests
    "PLR2004", # Magic value used in comparison
    "SIM117",  # Use a single with - acceptable in tests
]

"green_gov_rag/airflow/**" = [
    "AIR001",  # Airflow task variable names
    "D103",    # Missing docstring in public function
    "ANN201",  # Missing return type annotation
    "T201",    # print found - acceptable in Airflow
    "PLW1514", # open in text mode - acceptable in specific cases
    "SIM115",  # Use context handler
    "PTH123",  # Use Path.open()
]

"green_gov_rag/app/*" = [
    "D103",    # Missing docstring - UI code
    "ANN001",  # Missing type annotation - Streamlit
    "ANN201",  # Missing return type annotation
    "C901",    # Function too complex - UI code
    "PLR0915", # Too many statements
    "PLR0914", # Too many local variables
    "ARG005",  # Unused lambda argument
]

"green_gov_rag/scripts/*" = [
    "D103",    # Missing docstring
    "ANN001",  # Missing type annotation
    "ANN201",  # Missing return type annotation
    "T201",    # print found - acceptable in scripts
]

"green_gov_rag/cli.py" = [
    "PLC0415", # import should be at top - acceptable for CLI
]

"green_gov_rag/cloud/storage.py" = [
    "PLC0415", # import should be at top - lazy imports for optional deps
    "PTH123",  # Use Path.open() - acceptable with explicit compatibility
]

"green_gov_rag/cloud/config.py" = [
    "PLC0415", # import should be at top - avoid circular imports
]
